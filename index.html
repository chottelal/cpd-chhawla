    <title>CPD Certificate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Devanagari-capable and elegant serif fonts used in the sample certificate -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
      #certificate-preview { font-family: 'Noto Serif', 'Times New Roman', serif; }
      #certificate-preview .devanagari { font-family: 'Noto Sans Devanagari', 'Noto Serif', serif; }
      @media print {
        body { margin: 0; padding: 0; }
        body * { visibility: hidden !important; }
        #certificate-preview { visibility: visible !important; position: absolute !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; box-sizing: border-box !important; }
        #certificate-preview .outer-border, #certificate-preview .inner-border { box-shadow: none !important; }
        #certificate-preview { width: 1122px !important; height: 794px !important; padding: 0 !important; }
        #certificate-preview, #certificate-preview * { visibility: visible !important; }
        @page { size: A4 landscape; margin: 0; }
      }
      #certificate-preview .outer-border { border: 6px solid #111827; }
      #certificate-preview .inner-border { border: 2px solid #374151; }
    </style>
