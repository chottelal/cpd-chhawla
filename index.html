
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPD Certificate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Devanagari-capable and elegant serif fonts used in the sample certificate -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
      #certificate-preview, #bulk-certificate-preview { font-family: 'Noto Serif', 'Times New Roman', serif; }
      #certificate-preview .devanagari { font-family: 'Noto Sans Devanagari', 'Noto Serif', serif; }
      @media print {
        body { margin: 0; padding: 0; }
        body * { visibility: hidden !important; }
        #certificate-preview { visibility: visible !important; position: absolute !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; box-sizing: border-box !important; }
        #certificate-preview .outer-border, #certificate-preview .inner-border { box-shadow: none !important; }
        #certificate-preview { width: 794px !important; height: 1122px !important; padding: 0 !important; }
        #certificate-preview, #certificate-preview * { visibility: visible !important; }
        @page { size: A4 landscape; margin: 0; }
      }
      .cpd-certificate { background: #e5e7eb; padding: 16px; box-sizing: border-box; }
      .cpd-certificate__paper { min-height: 100%; box-sizing: border-box; background: #fff; border: 1px solid #111827; padding: 28px 34px; display: flex; flex-direction: column; }
      .cpd-certificate__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; text-align: center; }
      .cpd-certificate__logo { width: 88px; height: 102px; object-fit: contain; flex: 0 0 auto; }
      .cpd-certificate__heading { flex: 1; font-size: 10px; line-height: 1.28; }
      .cpd-certificate__heading h1 { margin: 3px 0; font-size: 17px; font-weight: 800; }
      .cpd-certificate__heading p { margin: 0; }
      .cpd-certificate__school-hindi { font-size: 13px; }
      .cpd-certificate__link { color: #075985; text-decoration: underline; }
      .cpd-certificate__codes { margin-top: 5px; padding-top: 4px; border-top: 1px solid #d1d5db; color: #b91c1c; font-size: 8px; font-weight: 700; text-align: center; white-space: nowrap; }
      .cpd-certificate__title { text-align: center; margin: 24px 0 20px; }
      .cpd-certificate__title h2 { display: inline-block; margin: 0; padding: 3px 8px; background: #fff36a; color: #c02626; font-size: 20px; font-weight: 800; }
      .cpd-certificate__title h3 { margin: 8px 0 0; font-size: 22px; color: #1d4ed8; font-weight: 800; }
      .cpd-certificate__body { flex: 1 1 auto; min-height: 0; font-size: 15px; line-height: 1.55; }
      .cpd-certificate__body p { margin: 0 0 18px; text-align: justify; }
      .cpd-certificate__body strong { color: #9a3412; text-decoration: underline; }
      .cpd-certificate__table { width: 100%; border-collapse: collapse; margin: 22px 0 14px; font-size: 12px; }
      .cpd-certificate__table th, .cpd-certificate__table td { border: 1px solid #374151; padding: 6px 5px; text-align: left; vertical-align: top; }
      .cpd-certificate__table th { background: #f3f4f6; font-weight: 700; }
      .cpd-certificate__details { font-size: 13px; }
      .cpd-certificate__footer { display: flex; justify-content: flex-end; align-items: flex-end; flex-shrink: 0; margin-top: 12px; font-size: 12px; }
      .cpd-certificate__footer p { margin: 4px 0; }
      .cpd-certificate__signature { width: 190px; text-align: center; }
      .cpd-certificate__signature img { display: block; width: 150px; height: 55px; object-fit: contain; margin: 0 auto 2px; }
      .cpd-certificate__signature p:first-of-type { font-weight: 700; }
      @media (max-width: 900px) { .cpd-certificate { padding: 0; overflow-x: auto; } #certificate-preview { transform-origin: top left; } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
